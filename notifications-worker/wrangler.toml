name = "classhub-notifications"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Cron : tourne toutes les 2 minutes (plan gratuit Cloudflare Workers inclus).
[triggers]
crons = ["*/2 * * * *"]

# Stockage du "curseur" (dernière exécution) entre deux passages du cron.
# Crée le namespace avec : wrangler kv namespace create NOTIF_STATE
# puis colle l'id retourné ci-dessous.
[[kv_namespaces]]
binding = "NOTIF_STATE"
id = "bdeea46ba90d4269859af62564b33b0a"
