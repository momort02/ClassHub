<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClassHub - Accueil</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ClassHub">
</head>
<body class="login-page">
  <div class="card" style="text-align: center;">
    <div style="font-size: 3rem; color: var(--accent); margin-bottom: 1rem;">
      <span class="material-icons" style="font-size: 60px;">school</span>
    </div>
    <h1 style="font-size: 2.2rem; margin-bottom: 1rem;">ClassHub</h1>
    <p style="color: var(--text-muted); margin-bottom: 2rem; line-height: 1.6;">
      La plateforme interactive de votre classe.
    </p>
    <a href="login.html" class="btn" style="text-decoration: none; width: 100%; justify-content: center;">
      <span class="material-icons">login</span> Se connecter
    </a>
  </div>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((err) => console.error("SW registration failed:", err));
      });
    }
  </script>
</body>
</html>
